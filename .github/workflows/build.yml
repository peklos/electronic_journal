name: Build Electronic Journal

on:
  push:
    branches: [ main, master, claude/** ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ElectronicJournal/ElectronicJournal.csproj

    - name: Build project
      run: dotnet build ElectronicJournal/ElectronicJournal.csproj --configuration Release --no-restore

    - name: Publish as single executable
      run: dotnet publish ElectronicJournal/ElectronicJournal.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -o ./publish

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ElectronicJournal-Windows
        path: ./publish/ElectronicJournal.exe

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ./publish/ElectronicJournal.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
